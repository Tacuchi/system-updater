name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Explícito y pinneado: el probe de cierre de consola es Python, y no
      # queremos depender de si la imagen trae `python`, `python3` o ninguno.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit suite — includes the encoding decoder + winget/choco/scoop parser
      # fixtures (OEM/UTF-16/BOM/non-English) and the hermetic non-interactive
      # auto-drive test. This is the cross-platform no-regression guarantee.
      - name: Test
        run: npm test

      # Builds dist/cli.js and runs the postbuild shebang assertion (LF).
      - name: Build
        run: npm run build

      # Smoke: the built bundle must load and report its version on every OS
      # (no upgrades performed).
      - name: Smoke (--version)
        run: node dist/cli.js --version

      # The probe's verdict logic is pure, so it is exercised on ALL THREE legs:
      # a green/red decision about a log is not a Windows question. What stays
      # Windows-only is the conversation with the OS.
      - name: Probe self-test (lógica de veredicto, los tres sistemas)
        timeout-minutes: 2
        run: python -VV && python scripts/probe-windows-console-close.py --self-test

      # Windows: the exit route with the LEAST margin and the one nobody can
      # retry. Launches the built binary in its own hidden console and posts
      # WM_CLOSE to that window — which the kernel turns into a genuine
      # CTRL_CLOSE_EVENT, i.e. a real SIGHUP, i.e. the product's actual path.
      # Not a cousin (SIGBREAK) and not a simulation (calling the handler).
      # It FAILS the job on any inconclusive condition instead of skipping: a
      # probe that skips when it cannot measure reports "covered" over nothing.
      #
      # Exit codes are a taxonomy, not a boolean:
      #   0 → green
      #   1 → THE PRODUCT failed: the log lost its closing line, or the exit code
      #       was not 129
      #   2 → INCONCLUSIVE: the probe could not measure (no console window on this
      #       runner, the child died booting, a manager got detected). That is NOT
      #       evidence about the product — read the message before changing code.
      # Both non-zero codes fail the job on purpose; the log says which one.
      - name: Probe — el cierre del registro sobrevive al cierre de consola
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -VV && python scripts/probe-windows-console-close.py dist/cli.js

      # Windows: report which managers are present WITHOUT upgrading anything.
      # The CI runner has choco + npm; winget and scoop are NOT preinstalled
      # (runner-images#8584), so a real upgrade run is skipped here. A real
      # non-interactive `--yes` run against winget/choco/scoop is the gated
      # validation that belongs on a real Windows machine (plan Open question).
      - name: Windows managers present (diagnostic, no upgrades)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($m in 'choco', 'winget', 'scoop', 'npm') {
            $cmd = Get-Command $m -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host "present: $m -> $($cmd.Source)" }
            else      { Write-Host "absent:  $m (skipped)" }
          }
